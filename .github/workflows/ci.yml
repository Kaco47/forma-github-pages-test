name: FORMA CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check runner Node.js
        run: node --version && node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<20 || (a===20 && b<9)) process.exit(1)"
      - run: node .github/ci/check-dependencies.mjs --preflight
      - run: npm ci --prefix .github/ci --ignore-scripts
      - run: node .github/ci/check-dependencies.mjs
      - run: npm run verify --prefix .github/ci
      - run: npm run build --prefix .github/ci
      - run: npm run verify --prefix .github/ci
      - run: npm run negative --prefix .github/ci
      - name: Require reproducible site output
        run: |
          git diff --exit-code -- . ':!.github'
          test -z "$(git ls-files --others --exclude-standard -- . ':!.github')"
  security-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check runner Node.js
        run: node --version && node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<20 || (a===20 && b<9)) process.exit(1)"
      - run: node .github/ci/check-dependencies.mjs --preflight
      - run: npm ci --prefix .github/ci --ignore-scripts
      - run: node .github/ci/check-dependencies.mjs
      - name: Audit all tool dependencies
        if: ${{ !cancelled() }}
        run: npm audit --prefix .github/ci --audit-level=low
